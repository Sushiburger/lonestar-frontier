# LoneStar - Censer rework by KC. Based off the arabianlamp entity.
- type: entity
  name: censer
  parent: BaseItem
  id: Censer
  description: Usually you put incense in there. It seems divinely powered...
  components:
  - type: Appearance
  - type: Item
    size: Small
    sprite: _NF/Objects/Misc/censer.rsi
    state: icon
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
  - type: MeleeWeapon
    wideAnimationRotation: 0
    damage:
      types:
        Blunt: 6
  - type: ItemToggleMeleeWeapon
    activatedDamage:
        types:
            Blunt: 6
            Heat: 6
    activatedSoundOnHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -12
    deactivatedSoundOnHitNoDamage:
      collection: MetalThud
  - type: ItemToggle
    predictable: false
    soundActivate:
      path: /Audio/Effects/cig_light.ogg
      params:
        variation: 0.15
        volume: 20
    soundDeactivate:
      path: /Audio/Effects/cig_snuff.ogg
      params:
        variation: 0.15
        volume: 10
  - type: ItemToggleHot
  - type: Sprite
    sprite: _NF/Objects/Misc/censer.rsi
    state: icon
    inhandVisuals:
      left:
      - state: inhand-left
      right:
      - state: inhand-right
    layers:
    - state: icon
    - state: flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  # - type: EntityStorageVisuals
  #   stateBaseClosed: lamp
  #   stateDoorOpen: lamp
  #   stateDoorClosed: lamptop
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: SolutionContainerManager
    solutions:
      Welder:
        reagents:
        - ReagentId: WeldingFuel
          Quantity: 1
        maxVol: 1
  - type: SolutionTransfer
    transferAmount: 5
    canChangeTransferAmount: false
  - type: DrawableSolution
    solution: Welder
  - type: RefillableSolution
    solution: Welder
  - type: DrainableSolution
    solution: Welder
  - type: ExaminableSolution
    solution: Welder
  - type: SolutionRegeneration
    solution: Welder
    generated:
      reagents:
      - ReagentId: WeldingFuel
        Quantity: 0.1
    duration: 5
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/welder_drop.ogg
  - type: Welder
    fuelConsumption: 0
    fuelLitCost: 0
    tankSafe: true
  - type: PointLight
    enabled: false
    netsync: false
    radius: 5
    color: "#e39c40"
  - type: ItemTogglePointLight
  - type: StaticPrice
    price: 1500
  # - type: Bible
  #   damage:
  #     groups:
  #       Brute: -15
  #       Burn: -15
  #   damageOnFail:
  #     groups:
  #       Brute: 15
  #       Airloss: 15
  #   damageOnUntrainedUse: ## What a non-chaplain takes when attempting to heal someone
  #     groups:
  #       Burn: 10
  # - type: UseDelay
  #   delay: 10.0
  - type: Censer
    damageOnUntrainedUse:
      groups:
        Burn: 10
  - type: Prayable
    bibleUserOnly: true
    sentMessage: prayer-popup-notify-pray-sent
    notificationPrefix: prayer-chat-notify-censer
    verb: prayer-verbs-pray
    verbImage: null
  - type: Tag
    tags:
     - ObjectOfSpiritualSignificance
     - Censer
  # - type: IgniteOnMeleeHit
  #   fireStacks: 1
